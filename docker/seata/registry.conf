registry {
  type = "nacos"

  nacos {
    application = "seata-server"
    serverAddr = "host.docker.internal:8848"
    group = "DEFAULT_GROUP"
    namespace = ""
    cluster = "default"
    username = "nacos"
    password = "nacos"
  }
}

config {
  type = "file"

  file {
    name = "file:/root/seata-config/file.conf"
  }
}
