spring:
  application:
    name: trade-service # 服务名称
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848 # nacos地址
      discovery:
        username: nacos
        password: nacos
      config:
        username: nacos
        password: nacos
        file-extension: yaml # 文件后缀名
        shared-configs: # 共享配置
          - dataId: shared-jdbc.yaml # 共享数据库与MyBatis配置
            refresh: true
          - dataId: shared-log.yaml # 共享日志配置
            refresh: true
          - dataId: shared-swagger.yaml # 共享Swagger配置
            refresh: true
